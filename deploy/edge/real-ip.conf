# Client IP when a load balancer / CDN sits in front of the edge.
#
# Without this file's directives the edge sees the load balancer as the
# client, and every user shares one IP (rate limits, audit trail). Uncomment
# and set the load balancer's address range — never 0.0.0.0/0, or any client
# could spoof its IP:
#
#   set_real_ip_from 10.0.0.0/16;        # your load balancer(s)
#   real_ip_header   X-Forwarded-For;    # or CF-Connecting-IP behind Cloudflare
#   real_ip_recursive on;
#
# The API trusts only the edge (TRUSTED_PROXIES), which forwards the client
# address it determined here.

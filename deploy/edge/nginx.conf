# Edge proxy for the all-in-one stack: one browser origin.
#   /api/  → two stateless API replicas (round robin, NO stickiness: sessions
#            live in Redis/PostgreSQL, so any replica serves any request, D-051)
#   /      → the frontend (static SPA container)
# Same origin means no CORS and the WebSocket origin check matches
# WS_ALLOWED_ORIGINS (the public URL of this proxy).
worker_processes auto;
events { worker_connections 4096; }

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: containers may restart with new IPs

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api {
    zone api 64k;
    server api-1:8080 resolve max_fails=1 fail_timeout=10s;
    server api-2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 32;
  }

  upstream web {
    zone web 64k;
    server web:8080 resolve;
  }

  server {
    listen 8080;
    client_max_body_size 10m;
    proxy_connect_timeout 1s;

    location = /edge-healthz { return 200 "ok\n"; }

    # API liveness/readiness (any replica), used by the smoke test and external monitors.
    location ~ ^/(healthz|readyz)$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Calculation WebSocket.
    location /api/v1/ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      # Must exceed the 20 s heartbeat and the server's 60 s idle timeout.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      # A draining replica answers the upgrade with 503 before consuming the ticket.
      proxy_next_upstream error timeout http_502 http_503;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
      # Only idempotent requests are retried (nginx default): POSTs are never replayed.
      proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}

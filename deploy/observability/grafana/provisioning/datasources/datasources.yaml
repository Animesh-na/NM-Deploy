# Provisioned data sources with cross-links:
#   Loki log line (trace_id) → Tempo trace
#   Tempo trace → Loki logs of the same trace, Prometheus metrics, service graph
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # trace_id is structured metadata (set by Alloy) and also in the JSON line.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{source=~"backend|frontend"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: Request rate (span metrics)
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: p95 latency (span metrics)
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      streamingEnabled:
        search: true

  # Read-only user directory and audit trail. The grafana_reader role can read
  # users(id, email, role, is_active, organization_id), organizations(id, name)
  # and audit_events only (created by the migrate job, D-064). Logs carry ids;
  # emails are resolved here, at view time.
  - name: Users and audit (PostgreSQL)
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: mcs_db
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
